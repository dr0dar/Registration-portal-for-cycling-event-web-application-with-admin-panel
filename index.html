<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Register your interest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #d4fc79, #96e6a1);
            font-family: 'Segoe UI', sans-serif;
        }

        .card-box {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            font-weight: 700;
            margin-bottom: 25px;
            color: #14532d; /* deep green */
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            margin-bottom: 15px;
        }

        ul li a {
            display: block;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            background: #198754; /* Bootstrap success green */
            color: white;
            transition: 0.3s;
        }

        ul li a:hover {
            background: #14532d;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 22px;
            }

            .card-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card-box">

            <h1>Cit-E Cycling web portal</h1>

            <ul>
                <li><a href="register_form.html">Register your interest for future events</a></li>
                <li><a href="admin_login.html">Admin login</a></li>
            </ul>

        </div>
    </div>

</body>

<script>
if (window.location.search.includes("success=1")) {
    alert("Registration successful!");
}
</script>
</html>
