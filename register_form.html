<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Register your interest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #d5fc797c, #96e6a185);
            padding: 15px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 5px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 7px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #14532d;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: #198754c2;
            font-weight: 500;
        }

        a:hover {
            color: #198754;
        }

        input[type="submit"] {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <a href="." class="back-link"><i class="bi bi-arrow-left">Back to index</i></a>

        <h1>Register your interest for future events</h1>

        <!-- Bootstrap validation class -->
        <form action="register.php" method="POST" class="needs-validation" novalidate>

            <p>Firstname</p>
            <input type="text" placeholder="Enter your firstname" name="firstname" class="form-control" required minlength="2">
            <div class="invalid-feedback">Enter a valid first name (min 2 characters)</div>

            <br/><p>Surname</p>
            <input type="text" placeholder="Enter your surname" name="surname" class="form-control" required minlength="2">
            <div class="invalid-feedback">Enter a valid surname</div>

            <br/><p>Email</p>
            <input type="email" placeholder="Enter your email" name="email" class="form-control" required>
            <div class="invalid-feedback">Enter a valid email address</div>

            <br/><p class="mt-3">Do you accept the terms and conditions?</p>
            <div class="form-check">
                <input type="checkbox" name="terms" value="yes" class="form-check-input" required>
                <label class="form-check-label">I accept the terms</label>
                <div class="invalid-feedback">You must accept before submitting</div>
            </div>

            <input type="submit" class="btn btn-success w-100">

        </form>

    </div>

<!-- Bootstrap validation script -->
<script>
(() => {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')

    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})();

if (window.location.search.includes("success=0")) {
    alert("Registration failed! Please register again.");
}

</script>

</body>
</html>
