<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login to the admin area</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a; /* dark admin feel */
            font-family: 'Segoe UI', sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #0f172a;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .back-link {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 10px 12px;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            background: white;
            color: #0f172a;
        }

        input[type="submit"] {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<!-- Back arrow -->
<a href="." class="back-link">
    Back to index
</a>

<div class="login-box">

    <!-- ORIGINAL STRUCTURE KEPT -->
    <h1>Login to the admin area</h1>
    <div class="subtitle">Secure access to admin dashboard</div>

    <form action="login.php" method="POST" class="needs-validation" novalidate>

        <p>Username</p>
        <input type="text" placeholder="Enter username" name="username" class="form-control" required>
        <div class="invalid-feedback">Enter username</div>

        <p class="mt-3">Password</p>
        <input type="password" placeholder="Enter password" name="password" class="form-control" required minlength="4">
        <div class="invalid-feedback">Enter valid password</div>

        <input type="submit" class="btn btn-primary w-100">

    </form>

</div>

<!-- validation -->
<script>
(() => {
    const forms = document.querySelectorAll('.needs-validation');

    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        });
    });
})();

if (window.location.search.includes("success=1")) {
    alert("Invalid username or password");
}
</script>

</body>
</html>
